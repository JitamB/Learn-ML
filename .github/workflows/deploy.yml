name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy redirect stub to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
          force_orphan: true

      - name: Trigger study-hub rebuild
        env:
          GH_TOKEN: ${{ secrets.STUDY_HUB_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo JitamB/study-hub --ref main
